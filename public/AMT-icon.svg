<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#FDE3A7"/>
    </linearGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4572E"/>
      <stop offset="1" stop-color="#9F1D1D"/>
    </linearGradient>
    <path id="topArc" d="M 62 256 A 194 194 0 0 1 450 256"/>
    <path id="botArc" d="M 52 256 A 204 204 0 0 0 460 256"/>
  </defs>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="250" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#FFE9B0" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFE9B0" stroke-width="3"/>

  <!-- ring text -->
  <text font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="34" fill="#FFF7E0" letter-spacing="5" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">AMBAJI MATA TEMPLE</textPath>
  </text>
  <text font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="26" fill="#FFF7E0" letter-spacing="6" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%" side="right">GUJARAT</textPath>
  </text>
  <circle cx="68" cy="256" r="7" fill="#FFE9B0"/>
  <circle cx="444" cy="256" r="7" fill="#FFE9B0"/>

  <!-- inner scene -->
  <clipPath id="inner"><circle cx="256" cy="256" r="146"/></clipPath>
  <g clip-path="url(#inner)">
    <rect x="100" y="100" width="312" height="312" fill="url(#sky)"/>
    <!-- sun rays -->
    <g stroke="#F6B73C" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="256" y1="200" x2="256" y2="118"/>
      <line x1="256" y1="200" x2="196" y2="132"/>
      <line x1="256" y1="200" x2="316" y2="132"/>
      <line x1="256" y1="200" x2="150" y2="170"/>
      <line x1="256" y1="200" x2="362" y2="170"/>
    </g>
    <circle cx="256" cy="200" r="30" fill="#F59E0B" opacity="0.55"/>

    <!-- temple: flag + kalash -->
    <line x1="256" y1="132" x2="256" y2="158" stroke="#7A1414" stroke-width="4"/>
    <path d="M256 132 L282 140 L256 148 Z" fill="#E4572E"/>
    <ellipse cx="256" cy="164" rx="8" ry="10" fill="#F5B800" stroke="#B8860B" stroke-width="2"/>
    <!-- shikhar tiers -->
    <path d="M256 172 L236 214 L276 214 Z" fill="url(#temple)"/>
    <path d="M256 190 L226 252 L286 252 Z" fill="url(#temple)"/>
    <path d="M256 214 L214 290 L298 290 Z" fill="url(#temple)"/>
    <path d="M256 240 L200 326 L312 326 Z" fill="url(#temple)"/>
    <!-- tier lines -->
    <g stroke="#FFE9B0" stroke-width="2" opacity="0.8">
      <line x1="238" y1="214" x2="274" y2="214"/>
      <line x1="228" y1="252" x2="284" y2="252"/>
      <line x1="216" y1="290" x2="296" y2="290"/>
    </g>
    <!-- mandap / base -->
    <rect x="178" y="326" width="156" height="34" fill="#9F1D1D"/>
    <rect x="170" y="358" width="172" height="12" fill="#7A1414"/>
    <!-- doorway -->
    <path d="M244 360 L244 336 Q256 322 268 336 L268 360 Z" fill="#FFE9B0"/>
    <!-- side mini spires -->
    <path d="M196 326 L196 298 L208 280 L220 298 L220 326 Z" fill="#C2331F"/>
    <path d="M292 326 L292 298 L304 280 L316 298 L316 326 Z" fill="#C2331F"/>
    <!-- lotus -->
    <g fill="#FFFFFF" stroke="#E4572E" stroke-width="2">
      <path d="M256 412 C238 400 232 384 256 372 C280 384 274 400 256 412 Z"/>
      <path d="M232 410 C214 402 208 388 224 380 C238 386 242 400 232 410 Z"/>
      <path d="M280 410 C298 402 304 388 288 380 C274 386 270 400 280 410 Z"/>
    </g>
  </g>
</svg>
